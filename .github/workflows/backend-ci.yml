name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Typecheck and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Typecheck
        run: mypy app

      - name: Run Alembic Upgrade
        env:
          APP_NAME: "Sistema Logistico Integral"
          APP_ENV: "test"
          APP_DEBUG: "true"
          DATABASE_URL: "postgresql+psycopg://postgres:postgrespassword@localhost:5432/postgres"
          BACKEND_CORS_ORIGINS: "http://localhost:5173"
        run: alembic upgrade head

      - name: Run Pytest
        env:
          APP_NAME: "Sistema Logistico Integral"
          APP_ENV: "test"
          APP_DEBUG: "true"
          DATABASE_URL: "postgresql+psycopg://postgres:postgrespassword@localhost:5432/postgres"
          BACKEND_CORS_ORIGINS: "http://localhost:5173"
        run: pytest -v
